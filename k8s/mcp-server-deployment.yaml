---
# ServiceAccount — reuse feishu-bot IRSA role (same aidevops permissions)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-server
  namespace: outline
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::604179600882:role/outline-demo-eks-feishu-bot-role
---
# ExternalSecret — pulls DEVOPS_AGENT_SPACE_ID + MCP_BEARER_TOKEN
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-server
  namespace: outline
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: mcp-server
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: outline/mcp-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: outline
  labels:
    app: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      serviceAccountName: mcp-server
      containers:
        - name: mcp-server
          image: 604179600882.dkr.ecr.us-east-1.amazonaws.com/mcp-server:latest
          envFrom:
            - secretRef:
                name: mcp-server
          env:
            - name: AWS_REGION
              value: "us-east-1"
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  namespace: outline
spec:
  selector:
    app: mcp-server
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-server
  namespace: outline
  annotations:
    alb.ingress.kubernetes.io/group.name: outline
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-port: "8081"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:604179600882:certificate/56fc605b-1d0a-4ab0-b4f1-3a43822754a1
spec:
  ingressClassName: alb
  rules:
    - host: mcp.devops-agent.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mcp-server
                port:
                  number: 8080
